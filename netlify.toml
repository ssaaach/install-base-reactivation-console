# Netlify works the same way: a static publish directory, no build step.
[build]
  publish = "app/dist"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The cover is the site root; the console keeps /index.html so deep links
# from the cover (index.html#accounts) resolve without a redirect hop.
[[redirects]]
  from = "/"
  to = "/landing.html"
  status = 200
